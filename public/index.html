<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Where is this app running?</title>
<style>
  :root { --bg:#13202e; --card:#1d3247; --ink:#f5f3ee; --muted:#c9d3dc; --accent:#f5a04a; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; font-family: system-ui, -apple-system, Segoe UI, sans-serif;
         background:var(--bg); color:var(--ink); display:flex; align-items:center; justify-content:center; }
  main { width:100%; max-width:560px; padding:24px 16px; }
  p.label { margin:0; color:var(--muted); font-size:.95rem; }
  h1 { margin:4px 0 24px; font-size:2.6rem; color:var(--accent); }
  dl { display:grid; grid-template-columns:auto 1fr; gap:10px 16px; margin:0 0 24px;
       background:var(--card); border-radius:12px; padding:18px; }
  dt { color:var(--muted); }
  dd { margin:0; font-family: ui-monospace, Menlo, Consolas, monospace; word-break:break-all; }
  button { width:100%; padding:14px; font-size:1rem; border:0; border-radius:10px;
           background:var(--accent); color:#13202e; font-weight:600; cursor:pointer; }
  #note { margin-top:16px; color:var(--muted); font-size:.9rem; }
</style>
</head>
<body>
<main>
  <p class="label">This page is being answered by…</p>
  <h1 id="where">…</h1>
  <dl>
    <dt>Region</dt><dd id="region">–</dd>
    <dt>Machine</dt><dd id="machine">–</dd>
    <dt>Copy alive for</dt><dd id="age">–</dd>
    <dt>Requests this copy served</dt><dd id="hits">–</dd>
  </dl>
  <button id="again">Ask again</button>
  <p id="note"></p>
</main>
<script>
  async function ask() {
    try {
      const res = await fetch("/api/where", { cache: "no-store" });
      const d = await res.json();
      document.getElementById("where").textContent = d.running_on;
      document.getElementById("region").textContent = d.region;
      document.getElementById("machine").textContent = d.machine;
      document.getElementById("age").textContent = d.copy_age_seconds + " s";
      document.getElementById("hits").textContent = d.hits_on_this_copy;
      document.getElementById("note").textContent = "Answered at " + new Date().toLocaleTimeString();
    } catch (err) {
      document.getElementById("where").textContent = "Can't reach the server";
      document.getElementById("note").textContent = err.message;
    }
  }
  document.getElementById("again").onclick = ask;
  ask();
</script>
</body>
</html>
